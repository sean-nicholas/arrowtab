    <dialog id="modal" class="p-4">
      <div class="grid grid-cols-2 gap-4">
        <input type="text" class="border-2 border-gray-300 p-2" />
        <input type="text" class="border-2 border-gray-300 p-2" />
        <button id="close-modal" class="border-2 p-2 col-span-2">Close</button>
      </div>
    </dialog>

    <script type="module">
      const modal = document.querySelector('#modal')
      document.querySelector('#open-modal').onclick = () => modal.showModal()
      document.querySelector('#close-modal').onclick = () => modal.close()

      document.querySelector('#open-dialog').onclick = () => {
        const portal = document.createElement('div')
        portal.innerHTML = `
          <div role="dialog" class="fixed top-20 left-20 bg-white border-4 p-4 grid grid-cols-2 gap-4">
            <input type="text" class="border-2 border-gray-300 p-2" />
            <button class="border-2 p-2">Close</button>
          </div>
        `
        portal.querySelector('button').onclick = () => portal.remove()
        document.body.append(portal)
        portal.querySelector('input').focus()
      }

      customElements.define(
        'shadow-field',
        class extends HTMLElement {
          constructor() {
            super()
            this.attachShadow({ mode: 'open' }).innerHTML = `
              <input placeholder="✅ shadow DOM" style="border: 2px solid #d1d5db; padding: 0.5rem" />
              <button style="border: 2px solid; padding: 0.5rem">shadow button</button>
            `
          }
        },
      )

      document.querySelector('#remove-me').onclick = (event) =>
        event.currentTarget.remove()

      const tabs = [...document.querySelectorAll('#tabs [role="tab"]')]
      document.querySelector('#tabs').addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return
        const next = tabs[(tabs.indexOf(event.target) + 1) % tabs.length]
        for (const tab of tabs) {
          tab.tabIndex = tab === next ? 0 : -1
          tab.setAttribute('aria-selected', String(tab === next))
        }
        next.focus()
      })
    </script>

    <div
      id="keys"
      class="fixed top-0 left-0 bottom-0 right-0 flex justify-end items-end p-8 pointer-events-none gap-4"
    ></div>

    <script type="module">
      import { initArrowTab } from './dist/index.js'
      initArrowTab({ debug: true, autoDetectHistory: true })
      document.addEventListener('arrowtab:navigate', (event) =>
        console.log('[demo] arrowtab:navigate', event.detail),
      )
    </script>

    <script type="module">
      const lastKeys = []
      document.addEventListener('keydown', (e) => {
        let arrow = ''
        if (e.key === 'ArrowDown') {
          arrow = '↓'
        } else if (e.key === 'ArrowUp') {
          arrow = '↑'
        } else if (e.key === 'ArrowLeft') {
          arrow = '←'
        } else if (e.key === 'ArrowRight') {
          arrow = '→'
        }

        if (!arrow) {
          return
        }

        lastKeys.push(arrow)

        if (lastKeys.length > 3) {
          lastKeys.shift()
        }

        document.querySelector('#keys').innerHTML = lastKeys
          .map(
            (key, index) => `
        <div
          class="flex items-center justify-center w-12 h-12 bg-gray-200 border-2 border-gray-400 rounded-md shadow-md ${
            index === lastKeys.length - 1 ? '' : 'opacity-50'
          }"
        >
          <span class="text-lg font-semibold text-gray-800">${key}</span>
        </div>
      `,
          )
          .join('')
      })
    </script>
